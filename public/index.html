<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>국내주식 상승 분석</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <!-- 테마 토글 (페이지 깜빡임 방지: 인라인 스크립트로 즉시 적용) -->
    <script>
    (function(){
        var t = localStorage.getItem('theme') || 'dark';
        if (t === 'light') document.documentElement.setAttribute('data-theme','light');
    })();
    </script>
    <button class="theme-toggle" id="themeToggle" title="다크/라이트 모드 전환"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>
    <div class="frame">
        <!-- 날짜 바 -->
        <div class="date-bar">
            <button class="date-nav" id="datePrev">&lsaquo;</button>
            <div class="date-center">
                <span class="date-badge" id="dateBadge">오늘</span>
                <span class="date-text" id="dateDisplay">-</span>
            </div>
            <button class="date-nav" id="dateNext">&rsaquo;</button>
        </div>

        <!-- 시장 탭 -->
        <nav class="tabs">
            <div class="tabs__left">
                <button class="tab active" data-market="ALL">전체</button>
                <button class="tab" data-market="KOSPI">코스피</button>
                <button class="tab" data-market="KOSDAQ">코스닥</button>
            </div>
            <button class="tab tab--watchlist" id="watchlistBtn">관심 종목</button>
        </nav>

        <!-- 로딩 / 에러 -->
        <div class="message" id="message" style="display:none;"></div>
        <div class="loading" id="loading" style="display:none;">데이터 로딩 중...</div>

        <!-- 순위 테이블 -->
        <div class="table-wrap">
            <table class="ranking-table" id="rankingTable">
                <thead>
                    <tr>
                        <th class="col-rank">#</th>
                        <th class="col-name">종목명</th>
                        <th class="col-price">현재가</th>
                        <th class="col-change">전일대비</th>
                        <th class="col-volume sortable" data-sort="trading_value">
                            거래대금 <span class="sort-icon">&#9660;</span>
                        </th>
                        <th class="col-cap sortable" data-sort="market_cap">
                            시가총액 <span class="sort-icon">&#9660;</span>
                        </th>
                        <th class="col-sector sortable" data-sort="sector">
                            섹터 <span class="sort-icon">&#9660;</span>
                        </th>
                        <th class="col-reason sortable" data-sort="theme_tag">
                            상승이유 <span class="sort-icon">&#9660;</span>
                        </th>
                        <th class="col-score">
                            호재점수
                            <span class="th-help">?<span class="tooltip tooltip--right">
                                <strong>호재 점수 v3 (100점)</strong><br><br>
                                <span class="tooltip-row">B 뉴스 양 (중복제거) <span class="tooltip-pts">20점</span></span>
                                <span class="tooltip-row">Q 뉴스 질 (언론사+수치) <span class="tooltip-pts">25점</span></span>
                                <span class="tooltip-row">T 호재 유형 (테마연동) <span class="tooltip-pts">30점</span></span>
                                <span class="tooltip-row">TV 시총대비 거래대금 <span class="tooltip-pts">25점</span></span>
                                <br><span style="color:var(--text-muted)">점수 클릭 시 관련 뉴스 확인</span>
                            </span></span>
                        </th>
                        <th class="col-link"></th>
                    </tr>
                </thead>
                <tbody id="rankingBody"></tbody>
            </table>
        </div>
    </div>

    <!-- 뉴스 모달 -->
    <div class="modal-overlay" id="newsModal" style="display:none;">
        <div class="modal news-modal">
            <div class="modal__header">
                <h3 class="modal__title" id="newsModalTitle">관련 뉴스</h3>
                <button class="modal__close" id="newsModalClose">&times;</button>
            </div>
            <div class="modal__body" id="newsModalBody"></div>
        </div>
    </div>

    <!-- 메모 모달 -->
    <div class="modal-overlay" id="memoModal" style="display:none;">
        <div class="modal">
            <div class="modal__header">
                <h3 class="modal__title" id="memoModalTitle">메모</h3>
                <button class="modal__close" id="memoModalClose">&times;</button>
            </div>
            <div class="modal__body">
                <textarea class="memo-textarea" id="memoTextarea" placeholder="이 종목에 대한 메모를 작성하세요..."></textarea>
                <div class="memo-actions">
                    <button class="memo-delete" id="memoDelete">삭제</button>
                    <button class="memo-save" id="memoSave">저장</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 태그 편집 모달 -->
    <div class="modal-overlay" id="tagModal" style="display:none;">
        <div class="modal modal--sm">
            <div class="modal__header">
                <h3 class="modal__title" id="tagModalTitle">테마 태그</h3>
                <button class="modal__close" id="tagModalClose">&times;</button>
            </div>
            <div class="modal__body">
                <div class="tag-edit-auto" id="tagAutoLabel"></div>
                <input type="text" class="tag-input" id="tagInput" placeholder="테마 태그 입력 (예: 광통신, AI)" maxlength="20">
                <div class="memo-actions">
                    <button class="memo-delete" id="tagReset">초기화</button>
                    <button class="memo-save" id="tagSave">저장</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/table.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
