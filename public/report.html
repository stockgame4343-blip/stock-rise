<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockRise — 데일리 리포트</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <script>
    (function(){
        var t = localStorage.getItem('theme') || 'dark';
        if (t === 'light') document.documentElement.setAttribute('data-theme','light');
    })();
    </script>

    <!-- ── 상단 타이틀 바 ── -->
    <header class="top-bar">
        <div class="top-bar__inner frame">
            <a class="top-bar__logo" href="/">StockRise</a>
            <nav class="top-bar__nav">
                <a href="/" class="top-bar__link">대시보드</a>
                <a href="/report.html" class="top-bar__link top-bar__link--active">리포트</a>
            </nav>
            <div class="top-bar__right">
                <span class="top-bar__updated" id="lastUpdated"></span>
                <button class="theme-toggle" id="themeToggle" title="다크/라이트 모드 전환">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                </button>
            </div>
        </div>
    </header>

    <div class="report frame">
        <!-- 날짜 네비게이션 -->
        <div class="report__date-bar">
            <button class="date-nav" id="datePrev">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
            </button>
            <h1 class="report__title" id="reportTitle">데일리 리포트</h1>
            <button class="date-nav" id="dateNext">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
            </button>
        </div>

        <!-- 로딩 -->
        <div class="loading" id="loading" style="display:none;">리포트 생성 중...</div>
        <div class="message" id="message" style="display:none;"></div>

        <!-- 리포트 본문 -->
        <div id="reportContent" style="display:none;">

            <!-- ── 요약 카드 ── -->
            <section class="report__summary">
                <div class="summary-card">
                    <span class="summary-card__label">분석 종목</span>
                    <span class="summary-card__value" id="sumCount">-</span>
                </div>
                <div class="summary-card">
                    <span class="summary-card__label">평균 상승률</span>
                    <span class="summary-card__value summary-card__value--rise" id="sumAvgRate">-</span>
                </div>
                <div class="summary-card">
                    <span class="summary-card__label">상한가</span>
                    <span class="summary-card__value summary-card__value--hot" id="sumLimit">-</span>
                </div>
                <div class="summary-card">
                    <span class="summary-card__label">총 거래대금</span>
                    <span class="summary-card__value" id="sumVolume">-</span>
                </div>
            </section>

            <!-- ── 주도 섹터 ── -->
            <section class="report__section">
                <h2 class="report__section-title">주도 섹터</h2>
                <p class="report__section-desc">상승 종목이 집중된 섹터 TOP 5</p>
                <div class="sector-cards" id="sectorCards"></div>
            </section>

            <!-- ── 핫 테마 ── -->
            <section class="report__section">
                <h2 class="report__section-title">핫 테마</h2>
                <p class="report__section-desc">오늘 시장을 이끈 테마 TOP 5</p>
                <div class="sector-cards" id="themeCards"></div>
            </section>

            <!-- ── 주목 종목 TOP 5 ── -->
            <section class="report__section">
                <h2 class="report__section-title">주목 종목</h2>
                <p class="report__section-desc">호재점수 기준 상위 5종목</p>
                <div class="stock-cards" id="stockCards"></div>
            </section>

            <!-- ── 주요 뉴스 ── -->
            <section class="report__section">
                <h2 class="report__section-title">주요 뉴스</h2>
                <p class="report__section-desc">호재점수 상위 종목의 핵심 뉴스</p>
                <div class="news-list" id="newsList"></div>
                <button class="report__more-btn" id="newsMoreBtn" style="display:none;">더보기</button>
            </section>
        </div>
    </div>

    <!-- ── 푸터 ── -->
    <div class="footer">
        <footer class="footer__wrap">
            <div class="frame footer__inner">
                <p class="footer__disclaimer">
                    본 사이트의 정보는 투자 권유가 아니며, 참고 목적으로만 제공됩니다.
                    투자 판단에 따른 손실은 본인에게 귀속되며, 데이터의 정확성을 보장하지 않습니다.
                </p>
                <p class="footer__copy">&copy; 2026 StockRise. 네이버 금융 데이터 기반.</p>
            </div>
        </footer>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/report.js"></script>
</body>
</html>
