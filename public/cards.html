<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StockRise — 카드뉴스</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/css/style.css">
<style>
body{background:var(--bg-primary);margin:0;min-height:100vh}
.cards-viewer{padding:40px 20px;display:flex;flex-direction:column;gap:40px;align-items:center}
.cards-viewer__status{color:var(--text-muted);padding:60px;font-size:15px}

.card{width:1080px;height:1080px;max-width:100%;overflow:hidden;position:relative;display:flex;flex-direction:column;font-family:'Pretendard',-apple-system,sans-serif;color:#fff;box-shadow:0 8px 40px rgba(0,0,0,.35)}
.card *{box-sizing:border-box;margin:0;padding:0;font-family:inherit}

/* ===== CARD 1: HERO ===== */
.c1{background:linear-gradient(135deg,#0a0a0f 0%,#1a1030 100%);padding:80px 80px 70px}
.c1__brand{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:700;letter-spacing:-.02em;opacity:.7}
.c1__brand-dot{width:10px;height:10px;border-radius:50%;background:#ff6b6b}
.c1__date{margin-top:8px;font-size:18px;color:#888;font-weight:500}
.c1__hook{margin-top:54px;font-size:36px;font-weight:600;color:#ff6b6b;letter-spacing:-.02em}
.c1__title{margin-top:16px;font-size:96px;font-weight:900;letter-spacing:-.04em;line-height:1}
.c1__sub{margin-top:24px;font-size:36px;font-weight:700;color:#ffd166;letter-spacing:-.02em}
.c1__stats{margin-top:70px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px}
.c1__stat{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:28px}
.c1__stat-label{font-size:18px;color:#aaa;font-weight:500}
.c1__stat-value{margin-top:10px;font-size:42px;font-weight:800;letter-spacing:-.03em}
.c1__stat-value.up{color:#ff6b6b}
.c1__reason{margin-top:auto;padding-top:44px;font-size:26px;color:#ccc;line-height:1.5;font-weight:500;border-top:1px solid rgba(255,255,255,.1)}
.c1__cta{margin-top:36px;font-size:20px;color:#666;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.c1__cta-r{color:#5b9df9}

/* ===== CARD 2: TOP 5 ===== */
.c2{background:#0f0f14;padding:80px}
.c2__label{display:inline-block;background:#ff6b6b;color:#fff;padding:10px 20px;border-radius:100px;font-size:20px;font-weight:800;letter-spacing:.02em}
.c2__title{margin-top:26px;font-size:72px;font-weight:900;letter-spacing:-.03em;line-height:1.1}
.c2__title span{color:#ff6b6b}
.c2__sub{margin-top:14px;font-size:24px;color:#888;font-weight:500}
.c2__list{margin-top:54px;display:flex;flex-direction:column;gap:18px}
.c2__item{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:22px;padding:24px 32px;display:flex;align-items:center;gap:28px}
.c2__item.lead{background:linear-gradient(135deg,rgba(255,107,107,.15),rgba(255,107,107,.02));border-color:rgba(255,107,107,.4)}
.c2__rank{font-size:48px;font-weight:900;color:#333;letter-spacing:-.05em;min-width:58px;text-align:center}
.c2__item.lead .c2__rank{color:#ff6b6b}
.c2__info{flex:1;min-width:0;overflow:hidden}
.c2__name{font-size:34px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c2__why{margin-top:4px;font-size:19px;color:#999;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c2__rate{font-size:40px;font-weight:900;color:#ff6b6b;letter-spacing:-.03em}
.c2__footer{margin-top:auto;padding-top:40px;display:flex;justify-content:space-between;color:#555;font-size:20px;font-weight:600}
.c2__footer-r{color:#5b9df9}

/* ===== CARD 3: THEMES ===== */
.c3{background:#fff;color:#0a0a0f;padding:80px}
.c3__label{display:inline-block;background:#0a0a0f;color:#fff;padding:10px 20px;border-radius:100px;font-size:20px;font-weight:800;letter-spacing:.02em}
.c3__title{margin-top:26px;font-size:68px;font-weight:900;letter-spacing:-.03em;line-height:1.1}
.c3__title span{color:#ff6b6b}
.c3__sub{margin-top:14px;font-size:22px;color:#666;font-weight:500}
.c3__list{margin-top:54px;display:flex;flex-direction:column;gap:22px}
.c3__item{background:#fafafa;border:1px solid #eee;border-radius:22px;padding:30px 36px}
.c3__item-head{display:flex;align-items:center;gap:20px}
.c3__item-rank{font-size:40px;font-weight:900;color:#ccc;min-width:52px;letter-spacing:-.05em}
.c3__item-name{font-size:36px;font-weight:800;letter-spacing:-.02em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c3__item-count{font-size:18px;color:#ff6b6b;font-weight:700;background:rgba(255,107,107,.1);padding:6px 14px;border-radius:100px;white-space:nowrap}
.c3__item-stocks{margin-top:12px;font-size:19px;color:#666;line-height:1.5;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.c3__footer{margin-top:auto;padding-top:40px;display:flex;justify-content:space-between;color:#999;font-size:20px;font-weight:600}
.c3__footer-r{color:#5b9df9}

@media (max-width:1160px){
  .cards-viewer{padding:20px 0}
  .card{width:calc(100vw - 24px);height:calc(100vw - 24px);border-radius:12px}
  .c1,.c2,.c3{padding:6%}
  .c1__title{font-size:8vw}
  .c1__sub{font-size:3.4vw}
  .c1__hook,.c1__reason{font-size:3vw}
  .c1__stat-label{font-size:1.8vw}
  .c1__stat-value{font-size:3.8vw}
  .c1__brand{font-size:2.2vw}
  .c1__date,.c1__cta{font-size:1.9vw}
  .c2__title,.c3__title{font-size:6.4vw}
  .c2__label,.c3__label,.c2__sub,.c3__sub{font-size:2vw}
  .c2__name,.c3__item-name{font-size:3.2vw}
  .c2__rank,.c3__item-rank{font-size:4.2vw;min-width:5vw}
  .c2__why,.c3__item-stocks{font-size:1.8vw}
  .c2__rate{font-size:3.6vw}
  .c3__item-count{font-size:1.7vw}
  .c2__footer,.c3__footer{font-size:1.8vw}
}
</style>
</head>
<body>
<script>
(function(){
  var t = localStorage.getItem('theme') || 'dark';
  if (t === 'light') document.documentElement.setAttribute('data-theme','light');
})();
</script>

<header class="top-bar">
  <div class="top-bar__inner frame">
    <a class="top-bar__logo" href="/">StockRise</a>
    <nav class="top-bar__nav">
      <a href="/" class="top-bar__link">랭킹</a>
      <a href="/nxt.html" class="top-bar__link">NXT</a>
      <a href="/report.html" class="top-bar__link">리포트</a>
      <a href="/cards.html" class="top-bar__link top-bar__link--active">카드뉴스</a>
    </nav>
    <div class="top-bar__right">
      <button class="theme-toggle" id="themeToggle" title="다크/라이트 모드 전환">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </div>
</header>

<main class="cards-viewer">
  <div class="cards-viewer__status" id="cardsStatus">카드뉴스 생성 중...</div>

  <!-- Card 1: HERO -->
  <div class="card c1" id="cardHero" style="display:none">
    <div class="c1__brand"><span class="c1__brand-dot"></span>StockRise</div>
    <div class="c1__date" id="heroDate"></div>
    <div class="c1__hook">오늘의 1등</div>
    <div class="c1__title" id="heroName"></div>
    <div class="c1__sub" id="heroTag"></div>
    <div class="c1__stats">
      <div class="c1__stat">
        <div class="c1__stat-label">상승률</div>
        <div class="c1__stat-value up" id="heroRate"></div>
      </div>
      <div class="c1__stat">
        <div class="c1__stat-label">종가</div>
        <div class="c1__stat-value" id="heroPrice"></div>
      </div>
      <div class="c1__stat">
        <div class="c1__stat-label">거래대금</div>
        <div class="c1__stat-value" id="heroTradeValue"></div>
      </div>
    </div>
    <div class="c1__reason" id="heroReason"></div>
    <div class="c1__cta">
      <span>@stockrise_kr</span>
      <span class="c1__cta-r">stockrise.vercel.app</span>
    </div>
  </div>

  <!-- Card 2: TOP 5 -->
  <div class="card c2" id="cardTop5" style="display:none">
    <span class="c2__label">TOP 5</span>
    <div class="c2__title">오늘의 <span>급등주</span></div>
    <div class="c2__sub" id="top5Date"></div>
    <div class="c2__list" id="top5List"></div>
    <div class="c2__footer">
      <span>@stockrise_kr</span>
      <span class="c2__footer-r">stockrise.vercel.app</span>
    </div>
  </div>

  <!-- Card 3: THEMES -->
  <div class="card c3" id="cardThemes" style="display:none">
    <span class="c3__label">HOT 테마</span>
    <div class="c3__title">오늘 뜨거운 <span>테마</span></div>
    <div class="c3__sub" id="themesDate"></div>
    <div class="c3__list" id="themesList"></div>
    <div class="c3__footer">
      <span>@stockrise_kr</span>
      <span class="c3__footer-r">stockrise.vercel.app</span>
    </div>
  </div>
</main>

<script>
(function(){
  var btn = document.getElementById('themeToggle');
  function sync() {
    var isLight = document.documentElement.getAttribute('data-theme') === 'light';
    btn.title = isLight ? '다크 모드로 전환' : '라이트 모드로 전환';
  }
  btn.addEventListener('click', function(){
    var isLight = document.documentElement.getAttribute('data-theme') === 'light';
    if (isLight) { document.documentElement.removeAttribute('data-theme'); localStorage.setItem('theme','dark'); }
    else { document.documentElement.setAttribute('data-theme','light'); localStorage.setItem('theme','light'); }
    sync();
  });
  sync();
})();
</script>
<script src="/js/cards.js"></script>
</body>
</html>
