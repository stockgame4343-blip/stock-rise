name: 주식 데이터 수집

on:
  # GitHub Actions native cron — 외부 cron-job.org 호출 누락 대비 백업·이중화
  # 평일 KST 09:06~15:21 15분 간격 (intraday) + 15:36 / 16:06 (closing)
  schedule:
    # KST 09:06~14:51 (UTC 00:06~05:51) 15분 간격, 평일
    - cron: '6,21,36,51 0,1,2,3,4,5 * * 1-5'
    # KST 15:06 / 15:21 (UTC 06:06/06:21) — intraday 마지막 구간
    - cron: '6,21 6 * * 1-5'
    # KST 15:36 (UTC 06:36) — closing 1차
    - cron: '36 6 * * 1-5'
    # KST 16:06 (UTC 07:06) — closing 최종
    - cron: '6 7 * * 1-5'

  workflow_dispatch:
    inputs:
      mode:
        description: '수집 모드 (intraday / closing)'
        required: false
        default: 'closing'

  repository_dispatch:
    types: [collect]

# 동시 실행 방지 — 외부 cron + native cron 거의 같은 시각 트리거 시 race condition 회피
concurrency:
  group: collect
  cancel-in-progress: false

env:
  TZ: Asia/Seoul

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Determine collection mode
        id: mode
        run: |
          TODAY=$(date +%Y%m%d)
          HOUR=$(date +%H)
          MINUTE=$(date +%M)
          NOW_MIN=$((HOUR * 60 + MINUTE))
          DOW=$(date +%u)  # 1=Mon, 7=Sun
          echo "today=$TODAY" >> $GITHUB_OUTPUT
          echo "hour=$HOUR" >> $GITHUB_OUTPUT

          # 주말 스킵 (schedule 이벤트만)
          if [ "${{ github.event_name }}" = "schedule" ] && [ $DOW -ge 6 ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "mode=intraday" >> $GITHUB_OUTPUT
            echo "주말 — 스킵"
            exit 0
          fi

          # 한국 공휴일(근로자의 날·어린이날·추석 등) 스킵 — schedule/repository_dispatch 만,
          # workflow_dispatch 는 수동이므로 통과
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            if ! python3 collector/kr_holidays.py "$TODAY" >/dev/null 2>&1; then
              echo "skip=true" >> $GITHUB_OUTPUT
              echo "mode=intraday" >> $GITHUB_OUTPUT
              echo "한국 휴장일($TODAY) — 스킵"
              exit 0
            fi
          fi

          # 수동/외부 트리거 시 입력값 또는 시간 기반 모드 결정
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.mode }}" ]; then
            echo "mode=${{ inputs.mode }}" >> $GITHUB_OUTPUT
            echo "skip=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # repository_dispatch는 payload에서 모드 읽기, 없으면 시간 기반
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            DISPATCH_MODE="${{ github.event.client_payload.mode }}"
            if [ -n "$DISPATCH_MODE" ]; then
              echo "mode=$DISPATCH_MODE" >> $GITHUB_OUTPUT
              echo "skip=false" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi

          # 15:30 이후 = 장마감 모드
          if [ $NOW_MIN -ge 930 ]; then
            MODE="closing"
            # 이미 장마감 최종 데이터가 있으면 스킵
            if [ -f "public/data/${TODAY}.json" ]; then
              IS_FINAL=$(python3 -c "
          import json
          with open('public/data/${TODAY}.json') as f:
              d = json.load(f)
          print(d.get('is_final', False))
          " 2>/dev/null || echo "False")
              if [ "$IS_FINAL" = "True" ]; then
                echo "skip=true" >> $GITHUB_OUTPUT
                echo "mode=closing" >> $GITHUB_OUTPUT
                echo "장마감 최종 데이터 이미 존재 — 스킵"
                exit 0
              fi
            fi
          else
            MODE="intraday"
          fi

          echo "mode=$MODE" >> $GITHUB_OUTPUT
          echo "skip=false" >> $GITHUB_OUTPUT
          echo "모드: $MODE / 시각: ${HOUR}:${MINUTE}"

      - uses: actions/setup-python@v5
        if: steps.mode.outputs.skip != 'true'
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: collector/requirements.txt

      - name: Install dependencies
        if: steps.mode.outputs.skip != 'true'
        run: |
          pip install -r collector/requirements.txt
          playwright install chromium --with-deps

      - name: Run collector
        if: steps.mode.outputs.skip != 'true'
        run: |
          cd collector
          MODE="${{ steps.mode.outputs.mode }}"
          echo "=== 수집 시작 (모드: $MODE) ==="
          for attempt in 1 2 3; do
            echo "--- 시도 ${attempt}/3 ---"
            if python collector.py --mode $MODE; then
              echo "수집 성공"
              exit 0
            fi
            echo "실패 — 60초 후 재시도"
            sleep 60
          done
          echo "::error::3회 시도 모두 실패"
          exit 1

      - name: Commit & push data
        if: steps.mode.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/ collector/theme_cache.json collector/news_history.json collector/backtest.json collector/sector_cache.json collector/naver_mapping.json
          MODE="${{ steps.mode.outputs.mode }}"
          TODAY=$(date +%Y%m%d)
          if [ "$MODE" = "closing" ]; then
            MSG="data: ${TODAY} 장마감 최종 수집"
          else
            MSG="data: ${TODAY} $(date +%H:%M) 장중 업데이트"
          fi
          git diff --staged --quiet && echo "변경 없음" && exit 0
          git commit -m "$MSG"
          # 단발 pull --rebase 는 cards/nxt 워크플로 push 와 경합 시 충돌 즉사 이력 —
          # 충돌 시 방금 수집한 데이터(-X theirs)가 이기도록 rebase 후 최대 3회 재시도
          for attempt in 1 2 3; do
            git fetch origin master
            if git -c rebase.autoStash=true rebase -X theirs origin/master; then
              if git push; then
                echo "push 성공 (시도 $attempt)"
                exit 0
              fi
            else
              echo "rebase 충돌 — abort 후 재시도"
              git rebase --abort || true
            fi
            sleep 5
          done
          echo "::error::push 3회 실패"
          exit 1

      # 마지막 안전망 — 외부 cron + GitHub schedule 모두 누락된 worst case 보호
      # collect 가 발사된다는 건 외부 cron-job.org 가 살아있음 → 그 발사 안에서 PRE 카드
      # 부재 시 cards-generate workflow_dispatch 강제 호출. workflow_run 도 누락 가능하니 대안.
      - name: Backup — dispatch cards generate if PRE missing
        if: steps.mode.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TODAY=$(date +%Y%m%d)
          if [ ! -f "public/cards/${TODAY}-pre.png" ] || [ ! -f "public/cards/${TODAY}-pre0.png" ]; then
            echo "오늘 PRE 카드 부재 — cards-generate workflow_dispatch 강제 호출"
            gh workflow run cards-generate.yml -f series=pre -f date=$TODAY || true
          else
            echo "오늘 PRE 카드 존재 — 스킵"
          fi
