name: 주식 데이터 수집

on:
  schedule:
    # ── 장중 (1시간 간격, 월~금) ──
    # 09:05 KST = 00:05 UTC
    - cron: '5 0 * * 1-5'
    # 10:05 KST = 01:05 UTC
    - cron: '5 1 * * 1-5'
    # 11:05 KST = 02:05 UTC
    - cron: '5 2 * * 1-5'
    # 12:05 KST = 03:05 UTC
    - cron: '5 3 * * 1-5'
    # 13:05 KST = 04:05 UTC
    - cron: '5 4 * * 1-5'
    # 14:05 KST = 05:05 UTC
    - cron: '5 5 * * 1-5'
    # 15:05 KST = 06:05 UTC
    - cron: '5 6 * * 1-5'

    # ── 장마감 최종 수집 (15:35 KST = 06:35 UTC) ──
    - cron: '35 6 * * 1-5'

    # ── 실패 시 재시도 ──
    # 15:45 KST = 06:45 UTC
    - cron: '45 6 * * 1-5'
    # 15:55 KST = 06:55 UTC
    - cron: '55 6 * * 1-5'

  workflow_dispatch:
    inputs:
      mode:
        description: '수집 모드 (intraday / closing)'
        required: false
        default: 'closing'

env:
  TZ: Asia/Seoul

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Determine collection mode
        id: mode
        run: |
          TODAY=$(date +%Y%m%d)
          HOUR=$(date +%H)
          MINUTE=$(date +%M)
          NOW_MIN=$((HOUR * 60 + MINUTE))
          echo "today=$TODAY" >> $GITHUB_OUTPUT
          echo "hour=$HOUR" >> $GITHUB_OUTPUT

          # 수동 실행 시 입력값 사용
          if [ -n "${{ inputs.mode }}" ]; then
            echo "mode=${{ inputs.mode }}" >> $GITHUB_OUTPUT
            echo "skip=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 15:30 이후 = 장마감 모드
          if [ $NOW_MIN -ge 930 ]; then
            MODE="closing"
            # 이미 장마감 최종 데이터가 있으면 스킵 (재시도 방지)
            if [ -f "public/data/${TODAY}.json" ]; then
              IS_FINAL=$(python3 -c "
          import json
          with open('public/data/${TODAY}.json') as f:
              d = json.load(f)
          print(d.get('is_final', False))
          " 2>/dev/null || echo "False")
              if [ "$IS_FINAL" = "True" ]; then
                echo "skip=true" >> $GITHUB_OUTPUT
                echo "mode=closing" >> $GITHUB_OUTPUT
                echo "장마감 최종 데이터 이미 존재 — 스킵"
                exit 0
              fi
            fi
          else
            MODE="intraday"
          fi

          echo "mode=$MODE" >> $GITHUB_OUTPUT
          echo "skip=false" >> $GITHUB_OUTPUT
          echo "모드: $MODE / 시각: ${HOUR}:${MINUTE}"

      - uses: actions/setup-python@v5
        if: steps.mode.outputs.skip != 'true'
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: collector/requirements.txt

      - name: Install dependencies
        if: steps.mode.outputs.skip != 'true'
        run: pip install -r collector/requirements.txt

      - name: Run collector
        if: steps.mode.outputs.skip != 'true'
        run: |
          cd collector
          MODE="${{ steps.mode.outputs.mode }}"
          echo "=== 수집 시작 (모드: $MODE) ==="
          for attempt in 1 2 3; do
            echo "--- 시도 ${attempt}/3 ---"
            if python collector.py --mode $MODE; then
              echo "수집 성공"
              exit 0
            fi
            echo "실패 — 60초 후 재시도"
            sleep 60
          done
          echo "::error::3회 시도 모두 실패"
          exit 1

      - name: Commit & push data
        if: steps.mode.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/ collector/theme_cache.json collector/news_history.json collector/backtest.json collector/sector_cache.json
          MODE="${{ steps.mode.outputs.mode }}"
          TODAY=$(date +%Y%m%d)
          if [ "$MODE" = "closing" ]; then
            MSG="data: ${TODAY} 장마감 최종 수집"
          else
            MSG="data: ${TODAY} $(date +%H:%M) 장중 업데이트"
          fi
          git diff --staged --quiet || git commit -m "$MSG"
          git pull --rebase origin master
          git push
