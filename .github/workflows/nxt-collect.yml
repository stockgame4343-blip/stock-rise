name: NXT 스냅샷 수집

# 스케줄 (KST): 월~금 16:05, 16:35, 17:05, 17:35, 18:05, 18:35, 19:05, 19:35, 20:05
# (애프터마켓 30분 간격, 9회)
# 프리마켓(08:05)은 제외 — 기준가(전일 종가)가 포스트마켓(본장 종가)과 달라 의미 충돌
# GitHub Actions cron 은 UTC 기준: KST 16:05~20:05 (월~금) = UTC 07:05~11:05 (월~금)
on:
  schedule:
    - cron: '5,35 7,8,9,10 * * 1-5'   # 7:05~10:35 (UTC) = KST 16:05~19:35 30분 간격
    - cron: '5 11 * * 1-5'             # 11:05 (UTC) = KST 20:05 (애프터마켓 마지막)
  # 외부 cron-job.org → api/cron-trigger.py → repository_dispatch (event_type=nxt)
  # GitHub Actions schedule 누락(67% 발생) 보강 — 외부 cron 트리거가 가장 신뢰성 ↑
  repository_dispatch:
    types: [nxt]
  workflow_dispatch:

# 동시 실행 방지
concurrency:
  group: nxt-collect
  cancel-in-progress: false

env:
  TZ: Asia/Seoul

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Holiday gate
        id: gate
        run: |
          TODAY=$(date +%Y%m%d)
          # workflow_dispatch 는 수동이므로 통과
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            if ! python3 collector/kr_holidays.py "$TODAY" >/dev/null 2>&1; then
              echo "skip=true" >> $GITHUB_OUTPUT
              echo "한국 휴장일($TODAY) — NXT 스킵"
              exit 0
            fi
          fi
          echo "skip=false" >> $GITHUB_OUTPUT

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.skip != 'true'
        with:
          python-version: '3.12'

      - name: Run NXT collector
        if: steps.gate.outputs.skip != 'true'
        run: |
          cd collector
          echo "=== NXT 수집 시작 (KST $(date +%H:%M)) ==="
          for attempt in 1 2 3; do
            echo "--- 시도 ${attempt}/3 ---"
            if python nxt_collector.py; then
              echo "수집 성공"
              break
            fi
            if [ $attempt -eq 3 ]; then
              echo "::error::3회 시도 모두 실패"
              exit 1
            fi
            echo "실패 — 30초 후 재시도"
            sleep 30
          done

      - name: Commit & push NXT data
        if: steps.gate.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/nxt/
          NOW=$(date +%H:%M)
          TODAY=$(date +%Y%m%d)
          git diff --staged --quiet || git commit -m "data: NXT ${TODAY} ${NOW} 스냅샷"
          git pull --rebase origin master
          git push
