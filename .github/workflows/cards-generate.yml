name: 카드뉴스 자동 생성

# ───────────────────────────────────────────────────────────────
# 일정 (KST)
#   07:30 평일 → PRE 시리즈 3장 (pre/pre2/pre3)
#                · 데이터: 가장 최근 마감 거래일 (dates.json 첫 항목)
#                · 새벽 NY 마감(yfinance) 데이터 신선
#                · 프리장(08:00) 시작 전 노출
#
#   16:30 평일 → CLOSING 시리즈 4장 (leader/leader2/close/close2)
#                · 데이터: 당일 closing (collect.yml 15:36 직후)
#                · 한국 장마감(15:30) 후 정리
#
# 트리거: cron + workflow_dispatch (수동) + workflow_run (closing collect 후 백업)
# ───────────────────────────────────────────────────────────────
on:
  # 외부 cron-job.org → api/cron-trigger.py → repository_dispatch
  # (event_type=cards, payload={series: pre|closing}) — 가장 신뢰성 높은 트리거
  repository_dispatch:
    types: [cards]
  # GitHub 자체 cron — schedule 누락 자주 일어나서 다중 발사 (idempotent)
  # PRE 시리즈: 07:30 / 08:05 / 09:00 / 09:30 KST 4중 발사. 한 슬롯 누락돼도 다음 슬롯 잡음.
  # CLOSING: 16:00 / 16:30 / 20:00 KST 3중 발사.
  schedule:
    # ── PRE (어제 마감 데이터 fallback) — GitHub schedule 가끔 일괄 누락 ──
    - cron: '30 22 * * 0-4'   # UTC 22:30 일~목 = KST 07:30 월~금 — primary
    - cron: '5 23 * * 0-4'    # UTC 23:05 일~목 = KST 08:05 월~금 — backup 1
    - cron: '35 23 * * 0-4'   # UTC 23:35 일~목 = KST 08:35 월~금 — backup 2
    - cron: '0 0 * * 1-5'     # UTC 00:00 월~금 = KST 09:00 월~금 — backup 3 (장 시작 1분 전)
    - cron: '30 0 * * 1-5'    # UTC 00:30 월~금 = KST 09:30 월~금 — backup 4 (장 시작 후)
    - cron: '0 1 * * 1-5'     # UTC 01:00 월~금 = KST 10:00 월~금 — backup 5
    # ── CLOSING ──
    - cron: '0 7 * * 1-5'     # UTC 07:00 = KST 16:00 — primary (마감 직후)
    - cron: '30 7 * * 1-5'    # UTC 07:30 = KST 16:30 — backup 1
    - cron: '0 11 * * 1-5'    # UTC 11:00 = KST 20:00 — 데이터 안정화 후 덮어쓰기
  workflow_run:
    workflows: ["주식 데이터 수집"]
    types: [completed]
    branches: [master, main]
  workflow_dispatch:
    inputs:
      series:
        description: '시리즈 (pre / closing / all)'
        required: false
        default: 'all'
        type: choice
        options: [pre, closing, all]
      date:
        description: '대상 날짜 YYYYMMDD (빈 값=dates.json 최신)'
        required: false

env:
  TZ: Asia/Seoul

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    # workflow_run 은 collect 워크플로우 성공 시 — 실제 closing 여부는 step 안에서
    # git log 로 확인. (dispatch 트리거된 워크플로우의 head_commit.message 는
    # 시작 시점 HEAD 이므로 collect 가 만든 새 커밋과 다름)
    if: |
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1

      - name: Resolve series + date
        id: target
        run: |
          # cron schedule 시각으로 시리즈 자동 결정
          # workflow_dispatch 또는 workflow_run 인 경우 inputs / default
          EVENT="${{ github.event_name }}"
          INPUT_SERIES="${{ inputs.series }}"
          INPUT_DATE="${{ inputs.date }}"

          if [ "$EVENT" = "repository_dispatch" ]; then
            # 외부 cron-job.org → cron-trigger.py 가 보낸 payload.series
            SERIES="${{ github.event.client_payload.series }}"
            [ -z "$SERIES" ] && SERIES="all"
          elif [ "$EVENT" = "schedule" ]; then
            HOUR_UTC=$(date -u +%H)
            # PRE — UTC 22 / 23 / 00 / 01 (KST 07:30 / 08:05 / 08:35 / 09:00 / 09:30 / 10:00)
            # CLOSING — UTC 07 / 11 (KST 16:00 / 16:30 / 20:00, 3중 발사)
            case "$HOUR_UTC" in
              22|23|00|01) SERIES="pre" ;;
              07|11)       SERIES="closing" ;;
              *)           SERIES="all" ;;
            esac
          elif [ "$EVENT" = "workflow_run" ]; then
            # collect.yml 성공 후
            LAST_MSG=$(git log -1 --pretty=%s)
            echo "  workflow_run 마지막 커밋: $LAST_MSG"
            if echo "$LAST_MSG" | grep -q "장마감 최종"; then
              SERIES="closing"
            else
              # 장중 데이터 — 오늘 PRE 카드 부재 시 강제 백업 생성 (schedule 누락 대비)
              TODAY_KST=$(date +%Y%m%d)
              if [ -f "public/cards/${TODAY_KST}-pre.png" ] && [ -f "public/cards/${TODAY_KST}-pre0.png" ]; then
                echo "  오늘 PRE 카드 이미 존재 — 스킵"
                echo "skip_event=true" >> $GITHUB_OUTPUT
                exit 0
              else
                echo "  오늘 PRE 카드 부재 — schedule 누락 백업 발사"
                SERIES="pre"
              fi
            fi
          elif [ -n "$INPUT_SERIES" ]; then
            SERIES="$INPUT_SERIES"
          else
            SERIES="all"
          fi

          # PRE / CLOSING 모두 KST today (오늘 거래일 라벨).
          # · PRE: 데이터 fallback 자동 (load_day fallback=True)
          # · CLOSING: 오늘 데이터 파일 필수 (gate 에서 검사)
          # all / workflow_run 은 dates.json 첫 (가장 최근 마감 거래일).
          if [ -n "$INPUT_DATE" ]; then
            DATE="$INPUT_DATE"
          elif [ "$SERIES" = "pre" ] || [ "$SERIES" = "closing" ]; then
            DATE=$(date +%Y%m%d)   # env TZ=Asia/Seoul → KST today
          elif [ -f "public/data/dates.json" ]; then
            DATE=$(python3 -c "import json; print(json.load(open('public/data/dates.json'))[0])" 2>/dev/null || echo "")
          fi
          [ -z "$DATE" ] && DATE=$(date +%Y%m%d)

          echo "series=$SERIES" >> $GITHUB_OUTPUT
          echo "date=$DATE" >> $GITHUB_OUTPUT
          echo "결정: series=$SERIES, date=$DATE (event=$EVENT)"

      - name: Skip if no trading data
        id: gate
        run: |
          DATE="${{ steps.target.outputs.date }}"
          SERIES="${{ steps.target.outputs.series }}"
          # PRE 시리즈는 fallback 가능 (오늘 데이터 없으면 dates.json 첫 사용).
          # CLOSING/all 은 오늘 데이터 파일 필수.
          if [ "$SERIES" = "pre" ]; then
            if [ ! -f "public/data/dates.json" ]; then
              echo "skip=true" >> $GITHUB_OUTPUT
              echo "dates.json 없음 — 스킵"
            else
              echo "skip=false" >> $GITHUB_OUTPUT
            fi
          else
            if [ ! -f "public/data/${DATE}.json" ]; then
              echo "skip=true" >> $GITHUB_OUTPUT
              echo "거래일 데이터 없음(${DATE}) — 스킵"
            else
              echo "skip=false" >> $GITHUB_OUTPUT
            fi
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.skip != 'true'
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: cards/requirements.txt

      - name: Install dependencies
        if: steps.gate.outputs.skip != 'true'
        run: |
          pip install -r cards/requirements.txt
          playwright install chromium --with-deps

      - name: Generate cards
        if: steps.gate.outputs.skip != 'true'
        run: |
          DATE="${{ steps.target.outputs.date }}"
          SERIES="${{ steps.target.outputs.series }}"
          echo "=== 카드 생성 — date=$DATE, series=$SERIES ==="
          for attempt in 1 2 3; do
            echo "--- 시도 ${attempt}/3 ---"
            if python -m cards.generate "$DATE" --series "$SERIES"; then
              echo "성공"
              exit 0
            fi
            echo "실패 — 30초 후 재시도"
            sleep 30
          done
          echo "::error::3회 시도 모두 실패"
          exit 1

      - name: Commit & push cards
        if: steps.gate.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/cards/
          DATE="${{ steps.target.outputs.date }}"
          SERIES="${{ steps.target.outputs.series }}"
          git diff --staged --quiet || git commit -m "cards: ${DATE} ${SERIES} 시리즈 생성"
          git pull --rebase origin master
          git push
