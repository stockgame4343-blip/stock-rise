name: 카드뉴스 자동 생성

# ───────────────────────────────────────────────────────────────
# 일정 (KST)
#   07:30 평일 → PRE 시리즈 3장 (pre/pre2/pre3)
#                · 데이터: 가장 최근 마감 거래일 (dates.json 첫 항목)
#                · 새벽 NY 마감(yfinance) 데이터 신선
#                · 프리장(08:00) 시작 전 노출
#
#   16:30 평일 → CLOSING 시리즈 4장 (leader/leader2/close/close2)
#                · 데이터: 당일 closing (collect.yml 15:36 직후)
#                · 한국 장마감(15:30) 후 정리
#
# 트리거: cron + workflow_dispatch (수동) + workflow_run (closing collect 후 백업)
# ───────────────────────────────────────────────────────────────
on:
  # 외부 cron-job.org → api/cron-trigger.py → repository_dispatch
  # (event_type=cards, payload={series: pre|closing}) — 가장 신뢰성 높은 트리거
  repository_dispatch:
    types: [cards]
  # GitHub 자체 cron (외부 트리거 실패 시 백업)
  schedule:
    # 평일 KST 07:30 = UTC 22:30 일~목 (PRE)
    - cron: '30 22 * * 0-4'
    # 평일 KST 16:30 = UTC 07:30 월~금 (CLOSING)
    - cron: '30 7 * * 1-5'
  workflow_run:
    workflows: ["주식 데이터 수집"]
    types: [completed]
    branches: [master, main]
  workflow_dispatch:
    inputs:
      series:
        description: '시리즈 (pre / closing / all)'
        required: false
        default: 'all'
        type: choice
        options: [pre, closing, all]
      date:
        description: '대상 날짜 YYYYMMDD (빈 값=dates.json 최신)'
        required: false

env:
  TZ: Asia/Seoul

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    # workflow_run 은 closing 수집 성공 시에만
    if: |
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       contains(github.event.workflow_run.head_commit.message, '장마감 최종'))

    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1

      - name: Resolve series + date
        id: target
        run: |
          # cron schedule 시각으로 시리즈 자동 결정
          # workflow_dispatch 또는 workflow_run 인 경우 inputs / default
          EVENT="${{ github.event_name }}"
          INPUT_SERIES="${{ inputs.series }}"
          INPUT_DATE="${{ inputs.date }}"

          if [ "$EVENT" = "repository_dispatch" ]; then
            # 외부 cron-job.org → cron-trigger.py 가 보낸 payload.series
            SERIES="${{ github.event.client_payload.series }}"
            [ -z "$SERIES" ] && SERIES="all"
          elif [ "$EVENT" = "schedule" ]; then
            HOUR_UTC=$(date -u +%H)
            # UTC 22:30 = PRE / UTC 07:30 = CLOSING
            if [ "$HOUR_UTC" = "22" ]; then
              SERIES="pre"
            elif [ "$HOUR_UTC" = "07" ]; then
              SERIES="closing"
            else
              SERIES="all"
            fi
          elif [ "$EVENT" = "workflow_run" ]; then
            # collect.yml(장마감 최종) 성공 후 백업 — closing 시리즈만
            SERIES="closing"
          elif [ -n "$INPUT_SERIES" ]; then
            SERIES="$INPUT_SERIES"
          else
            SERIES="all"
          fi

          if [ -n "$INPUT_DATE" ]; then
            DATE="$INPUT_DATE"
          elif [ -f "public/data/dates.json" ]; then
            DATE=$(python3 -c "import json; print(json.load(open('public/data/dates.json'))[0])" 2>/dev/null || echo "")
          fi
          [ -z "$DATE" ] && DATE=$(date +%Y%m%d)

          echo "series=$SERIES" >> $GITHUB_OUTPUT
          echo "date=$DATE" >> $GITHUB_OUTPUT
          echo "결정: series=$SERIES, date=$DATE (event=$EVENT)"

      - name: Skip if no trading data
        id: gate
        run: |
          DATE="${{ steps.target.outputs.date }}"
          if [ ! -f "public/data/${DATE}.json" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "거래일 데이터 없음(${DATE}) — 스킵"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.skip != 'true'
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: cards/requirements.txt

      - name: Install dependencies
        if: steps.gate.outputs.skip != 'true'
        run: |
          pip install -r cards/requirements.txt
          playwright install chromium --with-deps

      - name: Generate cards
        if: steps.gate.outputs.skip != 'true'
        run: |
          DATE="${{ steps.target.outputs.date }}"
          SERIES="${{ steps.target.outputs.series }}"
          echo "=== 카드 생성 — date=$DATE, series=$SERIES ==="
          for attempt in 1 2 3; do
            echo "--- 시도 ${attempt}/3 ---"
            if python -m cards.generate "$DATE" --series "$SERIES"; then
              echo "성공"
              exit 0
            fi
            echo "실패 — 30초 후 재시도"
            sleep 30
          done
          echo "::error::3회 시도 모두 실패"
          exit 1

      - name: Commit & push cards
        if: steps.gate.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/cards/
          DATE="${{ steps.target.outputs.date }}"
          SERIES="${{ steps.target.outputs.series }}"
          git diff --staged --quiet || git commit -m "cards: ${DATE} ${SERIES} 시리즈 생성"
          git pull --rebase origin master
          git push
